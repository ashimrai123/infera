# Secret stores API keys outside your source code.
#
# Kubernetes base64-encodes the values (this is NOT encryption -- it is just
# encoding). The real protection is RBAC: only pods in this namespace with
# the right service account can read this Secret.
#
# HOW TO CREATE THIS IN PRACTICE (do not commit real keys):
#
#   kubectl create secret generic infera-keys \
#     --namespace infera \
#     --from-literal=openai-api-key="sk-..." \
#     --from-literal=anthropic-api-key="sk-ant-..."
#
# OR base64-encode manually and fill in below:
#   echo -n "sk-..." | base64
#
# The placeholder values below are base64("changeme") -- replace before deploying.

apiVersion: v1
kind: Secret
metadata:
  name: infera-keys
  namespace: infera
type: Opaque
data:
  # Replace these with: echo -n "your-actual-key" | base64
  openai-api-key: Y2hhbmdlbWU=
  anthropic-api-key: Y2hhbmdlbWU=
